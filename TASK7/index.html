
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея изображений</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="intro">
            <p class="eyebrow">WEB DESIGN · TASK 07</p>
            <h1>Галерея изображений</h1>
            <p class="subtitle">
                Восемь фотографий, плавная прокрутка
                и адаптивный интерфейс.
            </p>
        </header>

        <section class="gallery" aria-label="Галерея фотографий">
            <button class="arrow arrow--prev" type="button"
                aria-label="Предыдущая страница">←</button>

            <div class="viewport">
                <div class="track">
                    <figure class="slide">
                        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1000&q=85" alt="Горное озеро">
                        <figcaption>Горное озеро</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=85" alt="Горный пейзаж">
                        <figcaption>Тёплый горизонт</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=1000&q=85" alt="Олень в лесу">
                        <figcaption>Дикая природа</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1000&q=85" alt="Лес">
                        <figcaption>Лесная тишина</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1000&q=85" alt="Озеро и горы">
                        <figcaption>Отражения</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1000&q=85" alt="Морские волны">
                        <figcaption>Морской воздух</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=85" alt="Горные вершины">
                        <figcaption>Выше облаков</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="https://images.unsplash.com/photo-1500534623283-312aadecef5b?auto=format&fit=crop&w=1000&q=85" alt="Пейзаж на закате">
                        <figcaption>Последний свет</figcaption>
                    </figure>
                </div>
            </div>

            <button class="arrow arrow--next" type="button"
                aria-label="Следующая страница">→</button>
        </section>

        <nav class="pager" aria-label="Страницы галереи">
            <button class="dot" type="button" aria-label="Страница 1"></button>
            <button class="dot" type="button" aria-label="Страница 2"></button>
            <button class="dot" type="button" aria-label="Страница 3"></button>
            <span class="page-count" aria-live="polite">01 / 03</span>
        </nav>

        <footer>
            <span class="footer-line"></span>
            <p>SCROLL THROUGH THE MOMENTS</p>
            <span class="footer-line"></span>
        </footer>
    </main>
</body>
</html>
